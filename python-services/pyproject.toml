[project]
name = "ronnyzim-python-services"
version = "0.1.0"
description = "Monorepo de servicos Python para o ecossistema RonnyZim OS"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.1",
    "mcp>=0.1.0",
    "supabase>=2.0.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
