name: CI - Chrome Extension (Validation)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'chrome-extension/**'
      - '.github/workflows/ci-extension.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'chrome-extension/**'
      - '.github/workflows/ci-extension.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: |
          if [ -f "chrome-extension/manifest.json" ]; then
            python3 -m json.tool chrome-extension/manifest.json > /dev/null && echo "✅ manifest.json is valid JSON"
          else
            echo "❌ manifest.json not found"
            exit 1
          fi

      - name: Check required files
        run: |
          FILES=("background.js" "content.js" "popup.js" "popup.html" "manifest.json")
          for file in "${FILES[@]}"; do
            if [ -f "chrome-extension/$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

      - name: Basic lint check (JSHint if available)
        run: |
          echo "Note: JSHint/ESLint setup optional for pure JavaScript files"
          echo "✅ Chrome Extension validation complete"
        continue-on-error: true
